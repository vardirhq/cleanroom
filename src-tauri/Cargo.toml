[package]
name = "cleanroom"
version = "0.2.0"
description = "Clinical desktop utility for Android junk-app cleanup over ADB"
authors = ["Cleanroom"]
edition = "2021"

[lib]
name = "cleanroom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
apk-info = "1.0.11"
base64 = "0.22"
pdfpdf = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
time = { version = "0.3", features = ["formatting", "local-offset", "parsing"] }
